<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 5秒後にリダイレクト設定 -->
  <meta http-equiv="refresh" content="5;url=19.html">
  <title>第三部 長老の使徒として円熟したペトロ - ペトロの生涯</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .image-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin: 0 auto 20px auto;
      max-width: 700px;
    }

    .image-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .image-card p {
      font-size: 0.9rem;
      padding: 10px;
      margin: 0;
      color: #666;
      background: #fdfdfd;
      border-top: 1px solid var(--border-color);
    }

    .quote-box {
      background: #fdfdfd;
      border-left: 4px solid var(--accent-color);
      padding: 15px 20px;
      margin: 20px auto;
      max-width: 600px;
      font-style: italic;
      color: #555;
      text-align: left;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      h1 { font-size: 1.5rem; }
      .subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="image-card">
    <img src="../img/part3/0.png" alt="手紙を書く使徒ペトロ (牧会者としての晩年)">
    <p>手紙を書く使徒ペトロ (牧会者としての晩年)</p>
  </div>

  <h1>第三部 長老の使徒として円熟したペトロ</h1>

  <div class="quote-box">
    「あなたがたに委ねられている、神の群れを牧しなさい」<br>
    (Iペトロ5章2節)を思わせる姿
  </div>

    <!-- 案内テキストとプログレスバー -->
  <div class="progress-bar-container">
    <div class="progress-bar"></div>
  </div>
</div>
<!-- モーダルウィンドウ用のHTML -->
  <div id="imageModal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImg" alt="拡大画像">
    <div id="modalCaption"></div>
  </div>
<script src="../js/script.js"></script>
