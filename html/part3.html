<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第三部 長老の使徒として円熟したペトロ - ペトロの生涯</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #8e44ad;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.8;
      color: var(--text-color);
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px 10px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }

    h1 {
      color: var(--primary-color);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-color);
      font-size: 1.2rem;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .image-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin: 0 auto 20px auto;
      max-width: 700px;
    }

    .image-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .image-card p {
      font-size: 0.9rem;
      padding: 10px;
      margin: 0;
      color: #666;
      background: #fdfdfd;
      border-top: 1px solid var(--border-color);
    }

    .quote-box {
      background: #fdfdfd;
      border-left: 4px solid var(--accent-color);
      padding: 15px 20px;
      margin: 20px auto;
      max-width: 600px;
      font-style: italic;
      color: #555;
      text-align: left;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      h1 { font-size: 1.5rem; }
      .subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="image-card">
    <img src="../img/part3_main.png" alt="手紙を書く使徒ペトロ (牧会者としての晩年)">
    <p>手紙を書く使徒ペトロ (牧会者としての晩年)</p>
  </div>

  <h1>第三部 長老の使徒として円熟したペトロ</h1>
  <div class="subtitle">- 信仰を後世に託した晩年 -</div>

  <div class="quote-box">
    「あなたがたに委ねられている、神の群れを牧しなさい」<br>
    (Iペトロ5章2節)を思わせる姿
  </div>

</div>

</body>
</html>
