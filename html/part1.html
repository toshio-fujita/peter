<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第一部 弟子として形成されるペトロ - ペトロの生涯</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #8e44ad;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e9ecef;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.8;
      color: var(--text-color);
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px 10px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }
   /* ==========================================
       スクロール連動アニメーションの設定
       ========================================== */
    .container > * {
      opacity: 0;
      transform: translateY(30px);
      transitio n: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    .container > *.is-show {
      opacity: 1;
      transform: translateY(0);
    }
    h1 {
      color: var(--primary-color);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--accent-color);
      font-size: 1.2rem;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .image-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin: 0 auto;
      max-width: 700px;
    }

    .image-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      h1 { font-size: 1.5rem; }
      .subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="image-card" style="margin-bottom: 30px;">
    <img src="../img/part1_main.png" alt="ガリラヤの海岸でのイエスと弟子たち">
  </div>

  <h1>第一部 弟子として形成されるペトロ</h1>
  <div class="subtitle">- ガリラヤから始まる召命の歩み -</div>

</div>
<!-- スクロールアニメーション用スクリプト -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const targets = document.querySelectorAll(".container > *");
    
    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-show");
          // 一度表示したら監視を終了する場合コメントを外す
          // observer.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.1 // 要素が10%見えたら発火
    });

    targets.forEach(target => {
      observer.observe(target);
    });
  });
</script>
</body>
</html>
