<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 5秒後にリダイレクト設定 -->
  <meta http-equiv="refresh" content="5;url=01.html">
  <title>第一部 弟子として形成されるペトロ - ペトロの生涯</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .image-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin: 0 auto;
      max-width: 700px;
    }

    .image-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      h1 { font-size: 1.5rem; }
      .subtitle { font-size: 1rem; }
    }
  </style>
</head>
<body>

<div class="container" style="text-align: center;">

  <div class="image-card" style="margin-bottom: 30px;">
    <img src="../img/part1/0.jpg" alt="ガリラヤの海岸でのイエスと弟子たち">
  </div>

  <h1>第一部 弟子として形成されるペトロ</h1>
  <div class="subtitle">- ガリラヤから始まる召命の歩み -</div>
  
  <!-- 案内テキストとプログレスバー -->
  <div class="progress-bar-container">
    <div class="progress-bar"></div>
  </div>

</div>


<!-- モーダルウィンドウ用のHTML -->
  <div id="imageModal" class="modal">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImg" alt="拡大画像">
    <div id="modalCaption"></div>
  </div>
<script src="../js/script.js"></script>
</body>
</html>
