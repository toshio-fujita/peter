<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 5秒後に同じ階層の mokuji.html にリダイレクト -->
<meta http-equiv="refresh" content="5;url=mokuji.html">

<!-- スマホ表示に必須の表示設定（ビューポート） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ペトロの生涯</title>

<!-- メタディスクリプション -->
<meta name="description" content="主によって造り変えられていく人間の物語">

<!-- OGP（SNS共有用）タグ -->
<meta property="og:title" content="ペトロの生涯">
<meta property="og:description" content="主によって造り変えられていく人間の物語">
<meta property="og:type" content="website">
<meta property="og:image" content="img/ogp.png">

<!-- Twitter Card用設定 -->
<meta name="twitter:card" content="summary_large_image">

<style>
  /* --- デザイン変数 --- */
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --card-bg: rgba(255, 255, 255, 0.95);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --accent-color: #2563eb;
    --accent-hover: #1d4ed8;
    --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0 16px; /* 上下のパディングをなくし、左右のみに設定 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
  }

  /* メインのカード枠 */
  .main-card {
    background: var(--card-bg);
    max-width: 480px;
    width: 100%;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: var(--shadow-lg);
    text-align: center;
    backdrop-filter: blur(10px);
    animation: fadeIn 0.8s ease-out;
  }

  /* タイトル & サブタイトル */
  .site-title {
    font-size: 1.75rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    margin: 0 0 8px 0;
    color: var(--text-primary);
  }

  .site-subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin: 0 0 24px 0;
    line-height: 1.5;
  }

  /* 表紙画像コンテナ */
  .cover-container {
    margin-bottom: 28px;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  .cover-image {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease;
  }

  .cover-container:hover .cover-image {
    transform: scale(1.02);
  }

  /* アクションエリア (ボタン & プログレスバー) */
  .navigation-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* 目次へ進むボタン */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 24px;
    background-color: var(--accent-color);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 12px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
  }

  .btn-primary:hover {
    background-color: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 12px -2px rgba(37, 99, 235, 0.3);
  }

  /* 5秒間のカウントダウン進行バー */
  .progress-container {
    width: 100%;
    text-align: center;
  }

  .redirect-text {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .progress-bar-bg {
    width: 100%;
    height: 4px;
    background-color: #e2e8f0;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background-color: var(--accent-color);
    width: 0%;
    animation: fillProgress 5s linear forwards;
  }

  /* アニメーション定義 */
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fillProgress {
    from { width: 0%; }
    to { width: 100%; }
  }

  /* スマホ微調整 */
  @media (max-width: 480px) {
    body {
      padding: 0 12px; /* スマホ時は左右のパディングを少し狭くして画面を広く活用 */
    }
    .main-card {
      padding: 24px 18px;
      border-radius: 16px;
    }
    .site-title {
      font-size: 1.5rem;
    }
    .site-subtitle {
      font-size: 0.875rem;
    }
  }
</style>
</head>

<body>

  <main class="main-card">
    <header>
    </header>

    <div class="cover-container">
      <img src="img/hyoushi.jpg" alt="ペトロの生涯 表紙画像" class="cover-image">
    </div>

    <div class="navigation-area">
      <!-- すぐに移動したい場合の手動ボタン -->
      <a href="mokuji.html" class="btn-primary">
        <span>目次を見る</span>
        <span aria-hidden="true">→</span>
      </a>

      <!-- 5秒自動転送を示すインジケーター -->
      <div class="progress-container">
        <div class="redirect-text">まもなく自動的に目次へ移動します</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
