<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホ表示に必須の表示設定（ビューポート） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表紙</title>
<style>
  /* 全体のスタイル（余白の調整など） */
  body {
    margin: 0;
    padding: 20px 10px;
    font-family: sans-serif;
  }

  /* コンテナの配置 */
  .cover-container {
    text-align: center;
    margin-bottom: 20px;
  }

  /* 画像のレスポンシブ設定 */
  .cover-image {
    width: 100%;
    max-width: 500px; /* 元のサイズである500px以上には拡大させない */
    height: auto;     /* 縦横比を維持 */
    display: inline-block;
  }

  /* リンクのスタイル */
  .navigation-link {
    text-align: center;
    font-size: 1.1rem;
  }
</style>
</head>

<body>

  <!-- 空のh1タグはアクセシビリティの観点から非推奨ですが、必要に応じてタイトル文字を入れてください -->
  <h1></h1>

  <div class="cover-container">
    <img src="img/hyoushi.jpg" alt="表紙画像" class="cover-image">
  </div>

  <p class="navigation-link">
    <a href="mokuji.html">目次へ進む</a>
  </p>

</body>
</html>
